name: 自建上游收集

# 自建上游（docs/PLAN_OWN_UPSTREAM.md）每日收集：官方未還原日線、三大法人、融資券、公司行為事件。
# 資料存 Release `selfhost-data`（約百 MB 級，不進 git；可用變數 DATA_REPO 指到私有 repo）；每次「下載舊版 → 補近 14 天缺的 → 閘門 → 才覆蓋」，
# 沿用上游 workflow 驗證過的保底做法，但閘門比上游嚴（檔數、倒退、市場別，見 scripts/selfhost_gate.py）。
#
# **每週一次（使用者 2026-10-06 決定）**：只在「當週最後一個交易日」台北 23:59 收集一次，一次補整週（收集器本來就補近 14 天缺的）；
# 原本每天三班（16:30／18:45／23:59），改週更後請求量少約 95%。當週最後交易日由 scripts/last_trading_day_guard.py 判斷
# （證交所 OpenAPI 休市表；抓不到就 fail-open 照跑）。例：2026-10-09 週五國慶補假 → 當週最後交易日是 10-08 週四。
# 手動觸發（workflow_dispatch）一律執行。⚠️ 停止買賣快照（只回當天）因此每週只有一天，沒有下游用它，可接受。
# 為什麼要第三班：官方當日資料收盤後會被更正、融資券要 20:30～22:30 才陸續出齊（實測 2026-10-05 投信 14 檔、成交量 17 檔事後改過；
# tw-stock-data 的 23:59 那班也是為了修正 19:00 的錯漏）。收集器對最近 3 個日曆日每次重抓覆蓋，其餘只補缺的，重跑冪等；
# 上市／上櫃各自記進度（上游用 2330 當唯一進度，上櫃缺日補不回來）。
# tw-hold 是公開 repo → Actions 分鐘數無限。
#
# 首次：本機跑完 selfhost_backfill.py 後，把 data/selfhost/*.parquet 上傳成 Release `selfhost-data`
#   gh release create selfhost-data data/selfhost/{raw_prices,inst,margin,notrade,refmark,stophalt,corp_actions,ev_fm_reduction}.parquet \
#     data/selfhost/ev_fm_reduction_done.json \
#     --title "自建上游資料" --notes "由 selfhost_collect.yml 維護；勿手動覆蓋"

on:
  workflow_dispatch:
  schedule:
    # 每個平日台北 23:59（UTC 15:59）觸發，但**只有「當週最後交易日」才真的收集**（見 guard 步驟）。
    # 為什麼 23:59：官方當日資料收盤後會被更正、融資券要 20:30～22:30 才陸續出齊，這班拿到的是最完整的版本。
    - cron: "59 15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: selfhost
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 資料存哪個 repo 的 Release：預設本 repo；設了變數 DATA_REPO（例 owner/tw-hold-data）＋ secret DATA_REPO_PAT 就改寫到那邊
      # （程式公開、資料放私有 repo——見 README「資料來源與授權」）。gh release 指令一律吃這兩個環境變數，下面不用改。
      # ⚠ 順序：先設 secret、再設變數；只設變數沒設 secret 會因沒有權限而中止（閘門前就停，不傷資料）。
      GH_TOKEN: ${{ secrets.DATA_REPO_PAT || github.token }}
      GH_REPO: ${{ vars.DATA_REPO || github.repository }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas pyarrow requests

      - name: 今天是當週最後交易日嗎？
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/last_trading_day_guard.py

      - name: 下載上一版（保底基準）
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p data/selfhost/_base
          if gh release view selfhost-data >/dev/null 2>&1; then
            # Release 上實際有哪些檔：有列出卻下載失敗 ＝ 錯（重試 3 次仍失敗就中止），不可當成「尚無舊版」
            # （否則閘門沒有基準可比、會放行一份只有 14 天的小檔去覆蓋整份歷史）
            gh release view selfhost-data --json assets --jq '.assets[].name' > data/selfhost/_assets.txt
            for f in raw_prices.parquet inst.parquet margin.parquet notrade.parquet refmark.parquet stophalt.parquet corp_actions.parquet ev_fm_reduction.parquet ev_fm_reduction_done.json ev_official_meta.jsonl forecast_twt48u.jsonl; do
              if grep -qx "$f" data/selfhost/_assets.txt; then
                ok=0
                for try in 1 2 3; do
                  gh release download selfhost-data -D data/selfhost/_base -p "$f" --clobber && ok=1 && break
                  sleep $((try * 10))
                done
                [ "$ok" = 1 ] || { echo "::error::下載 $f 失敗（Release 上有）——中止，不繼續"; exit 1; }
              else
                echo "（Release 尚無 $f，略過）"
              fi
            done
            cp data/selfhost/_base/* data/selfhost/ 2>/dev/null || true
            ls -la data/selfhost/_base
          else
            echo "::error::Release selfhost-data 不存在——先用本機種子建立（見本檔頭說明）"; exit 1
          fi

      # 各步 continue-on-error：單一資料源掛掉不擋其他；閘門才是最後把關。
      - name: 官方未還原日線（上市＋上櫃）
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/selfhost_raw_prices.py

      - name: 三大法人＋融資券
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/selfhost_chips.py

      # 停止買賣中名單沒有歷史（date= 參數被官方忽略）→ 漏抓一天永久少一天，所以每班都抓（冪等）。
      # 累積型檔：只增不減（merge_into 內有斷言）；首次種子見 scripts/selfhost_stophalt.py 檔頭。
      - name: 上市停止買賣中快照
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/selfhost_stophalt.py

      # build 以 Release 下載回來的舊 corp_actions 為底聯集新事件（沒有歷史來源檔也不會退化）。
      - name: 公司行為事件（官方除權息近兩個月＋FinMind 分割／面額）
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          START=$(date -u -d "$(date -u +%Y-%m-01) -2 month" +%Y-%m-%d)
          python scripts/selfhost_events.py --official "$START" --finmind-split --build

      # 官方減資／面額變更表（TWTAUU、revivt、TWTB8U）免逐檔、可日期區間，是事件表的**主來源**；
      # 近兩年重抓一次（含已公告的新事件），冪等。
      - name: 官方減資／面額變更
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          START=$(date -u -d "-2 year" +%Y-01-01)
          python scripts/selfhost_events.py --official-act "$START" --build

      # FinMind 減資（逐檔）只當交叉驗證（2026-10-05 實測：FinMind 已查 345 件全部在官方表內、因子差中位數 0）；
      # 每週五輪詢 150 檔，避免占用與 tw-swing 共用的 FinMind 額度。
      - name: 減資事件輪詢（週五，交叉驗證）
        if: (github.event_name == 'workflow_dispatch' || github.event.schedule == '59 15 * * 1-5') && steps.guard.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if [ "$(date -u +%u)" = 5 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/selfhost_events.py --finmind-reduction --max-calls 150 --no-wait --build
          fi

      # 除權除息預告表（TWT48U，只有未來、沒有歷史）每週存一份快照：量測各類事件實際預告提前多久、預掛下一週還原參數用。
      # 累積檔只增不減（腳本內有斷言）；每週 1 次官方請求，不增加頻率。不進閘門。
      - name: 除權除息預告表快照
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/selfhost_forecast_snapshot.py

      - name: 閘門（不比舊版差才放行）
        if: steps.guard.outputs.run == 'true'
        id: gate
        run: python scripts/selfhost_gate.py --base data/selfhost/_base --live data/selfhost --assets data/selfhost/_assets.txt

      - name: 上傳 Release（僅閘門通過）
        if: (steps.gate.outcome == 'success') && steps.guard.outputs.run == 'true'
        run: |
          for f in raw_prices.parquet inst.parquet margin.parquet notrade.parquet refmark.parquet stophalt.parquet corp_actions.parquet ev_fm_reduction.parquet ev_fm_reduction_done.json ev_official_meta.jsonl forecast_twt48u.jsonl; do
            [ -f data/selfhost/$f ] && gh release upload selfhost-data data/selfhost/$f --clobber
          done
          # 週五另留一份帶日期的快照（壞版本不能是唯一的版本）；保留最近 4 份
          if [ "$(date -u +%u)" = 5 ]; then
            D=$(date -u +%Y%m%d)
            for f in raw_prices inst margin corp_actions; do
              [ -f data/selfhost/$f.parquet ] && cp data/selfhost/$f.parquet "data/selfhost/snap-$D-$f.parquet" \
                && gh release upload selfhost-data "data/selfhost/snap-$D-$f.parquet" --clobber
            done
            gh release view selfhost-data --json assets --jq '.assets[].name' | grep '^snap-' | sed -E 's/^snap-([0-9]{8})-.*/\1/' \
              | sort -u | head -n -4 | while read old; do
                gh release view selfhost-data --json assets --jq '.assets[].name' | grep "^snap-$old-" | xargs -r -n1 gh release delete-asset selfhost-data -y
              done
          fi

      - name: commit 狀態小檔
        if: always() && steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "tw-hold-bot"
          git config user.email "noreply@github.com"
          FILES="data/derived/selfhost_status.json"
          [ -f data/derived/selfhost_status.json ] || { echo "沒有狀態檔——跳過"; exit 0; }
          git add $FILES
          git diff --cached --quiet -- $FILES && { echo "無實質變更——跳過 commit"; exit 0; }
          git commit -m "自建上游狀態 $(date -u +%F)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git push; then pushed=1; break; fi
            sleep $(( (RANDOM % 5) + i * 3 ))
            git pull --rebase origin main || { git checkout --theirs -- $FILES 2>/dev/null || true; git add -A $FILES; GIT_EDITOR=true git rebase --continue || git rebase --abort || true; }
          done
          [ "$pushed" = 1 ] || { echo "::error::push 連續失敗"; exit 1; }
