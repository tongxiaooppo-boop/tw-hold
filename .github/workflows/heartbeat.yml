name: 心跳（開盤前新鮮度守門）

# 守門員 G4（PLAN §M0.2）：rebuild 由 tw-swing 的 repository_dispatch 觸發——
# 若 tw-swing publish 斷了、dispatch 不再來，rebuild **不會失敗、只是不再跑**，
# 沒人會發現。這支在台股開盤前醒來檢查：
#   1. data/derived/_meta.json 的 trading_date（三清單／個股查詢底層 bundle）
#   2. data/reference/index_0050.parquet 最後一筆日期（總經導航上市卡）
#   3. data/reference/index_006201.parquet 最後一筆日期（總經導航上櫃卡）
# 邏輯見 scripts/freshness_check.py（判斷本體在 reference/freshness.py）。
#
# 2 和 3 是 2026-09-16 起獨立落地的小檔，各有自己的時鐘（不再跟 bundle 共用），
# 且兩支腳本都是「驗證沒過就保留舊檔」——所以「檔案日期凍住」正是那種
# 「rebuild 天天跑得好好的、但某支代理連續被驗證擋下」的慢性問題的唯一外顯徵兆。
#
# 2026-09-16：從每週一次、只看 rebuilt_at 有沒有變，改成每個交易日開盤前跑、
# 直接比對 trading_date 本身——因為「rebuild 有跑」不等於「bundle 資料是新的」
# （G3 只警告不擋），舊機制抓不到「rebuild 準時跑但吃到舊 bundle」這種情況。
# 告警訊息把各項的落後天數列出來，讓「為什麼沒更新」直接從告警看得出來，
# 不用回頭挖 workflow log。
#
# ⚠️ 這個 job 自己不可以失敗（同 notify-failure 的理由）——檢查不過是 warning + 告警，
#    不是 exit 1。
#
# GitHub 排程政策：repo 連續 60 天無活動會自動停用 cron。rebuild 每天 commit
# → 只要 rebuild 還活著這支就不會被停；這支要抓的正是「rebuild 不再活著／
# 活著但沒吃到新資料」。

on:
  schedule:
    - cron: "30 0 * * 1-5"     # 平日 UTC 00:30 = 台北 08:30，開盤（09:00）前 30 分
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas pyarrow

      - name: 開盤前新鮮度檢查
        id: freshness
        run: |
          python scripts/freshness_check.py || true
          python scripts/freshness_check.py --json > /tmp/freshness.json

      - name: 附帶重算時間（診斷用：rebuild 有沒有跑 vs 跑了但資料還是舊的）
        run: |
          META=data/derived/_meta.json
          if [ -f "$META" ]; then
            echo "上次重算 rebuilt_at：$(jq -r '.rebuilt_at // "未知"' "$META")"
          else
            echo "$META 不存在——rebuild 還沒產出過任何清單"
          fi

      - name: 有 stale 就告警
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
        run: |
          ALL_OK=$(jq -r '.all_ok' /tmp/freshness.json)
          if [ "$ALL_OK" = "true" ]; then echo "OK：三項都新鮮"; exit 0; fi

          META=data/derived/_meta.json
          REBUILT=$(jq -r '.rebuilt_at // "未知"' "$META" 2>/dev/null || echo "未知")
          DETAIL=$(jq -r '.checks[] | select(.ok==false) |
            "・\(.label)：最後 \(.last_date // "無資料")，預期交易日 \(.expected)（\(.reason)）"' \
            /tmp/freshness.json)

          MSG="🟠 tw-hold 開盤前資料還是舊的
          ${DETAIL}
          上次三清單重算（rebuilt_at）：${REBUILT}

          怎麼判斷是哪一段斷的：
          - rebuilt_at 也很舊 → 先去 tw-hold Actions 查 rebuild.yml 最近幾次
            run 的時間，不要只看 rebuilt_at 這個數字：三清單/bundle 內容沒變
            的日子 rebuild.yml 會正常跑完但**刻意不 commit**（見 rebuild.yml
            的 diff --cached --quiet 那段），rebuilt_at 就不會前進，這種情況
            看起來像「斷了」但其實是正常運作；只有「rebuild.yml 最近都沒有
            run 記錄」才是真的 dispatch 沒送到或 rebuild.yml 本身失敗。
          - rebuilt_at 是今天、但 trading_date 還是舊的 → rebuild 有跑，但
            fetch_bundle.py 拉到的 bundle 本身就是舊的（tw-swing 那邊沒發新版），
            查 tw-swing 的 fundamentals.yml / publish_bundle.yml。
          - 只有 0050／006201 其中一項 stale、三清單正常 → 那支代理自己斷了：
            要嘛抓取失敗（FinMind API／token／網路），要嘛**資料沒過驗證被擋下、
            保留了舊檔**（reference/price_series_guard.py）。查 rebuild.yml 的
            「市場代理快照沒更新才告警」那步跟它上面那步的 log，不影響三清單。
          - 若正值國定連假／農曆春節：SLACK_DAYS 只留 2 天緩衝，蓋不住長假，
            這段期間每個平日早上都會收到這則，是已知的假警報，不用理。"
          echo "$MSG"
          [ -z "$WEBHOOK" ] && { echo "::warning::無 ALERT_WEBHOOK"; exit 0; }
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content: $m, text: $m}')" || true
          exit 0
