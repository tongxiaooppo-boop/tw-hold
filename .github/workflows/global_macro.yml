name: 國際總經快照

# 獨立於 rebuild.yml——那條是台股 bundle 觸發（台北午後），美股都還沒開盤。
# 這條排 UTC 22:00（美東 4pm 收盤最晚 21:00 UTC，留 1 小時緩衝）＝台北隔天 06:00。
# 日經/恆生/KOSPI 台北時間下午就收了，資料早就到齊，跟著美股排程一起拉即可，
# 不用另外排更早的時間。
#
# yfinance 免費、tw-hold 是公開 repo → Actions 分鐘數無限（2026-09-13 查證，
# 不佔 tw-swing 那顆私有 repo 的每月 2000 分鐘額度）。
#
# 見 scripts/fetch_global_macro.py 檔頭：一天一次抓「已完成的常規盤收盤」，絕不即時
# （memory `tw-hold-us-stock-tracking-design`，2026-09-11 定案）。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: global-macro
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 刻意不動 requirements.txt——那份是給 Streamlit Cloud app 用的（PRD 明講
      # 「刻意控依賴」），yfinance 只有這支 CI 腳本要，裝在這裡就好。
      - run: pip install pandas pyarrow yfinance

      - name: 抓國際指數/個股/總經指標
        run: python scripts/fetch_global_macro.py

      # 台指期近月日盤/夜盤——TAIFEX OpenAPI 免key，跟這條排程同一個時間點最合適
      # （夜盤 05:00 收，這條 06:00 跑）。continue-on-error：TAIFEX 偶爾不給資料
      # 不該擋掉上面美股/國際指數那筆真正的每日快照。
      - name: 台指期近月日盤/夜盤
        continue-on-error: true
        run: python scripts/fetch_tx_futures.py

      # Put/Call Ratio——這支 API 自帶 ~21 個交易日歷史，跟只給最新一天的
      # DailyMarketReportFut 不同，一樣 continue-on-error 不擋主線。
      - name: 台指選擇權 Put/Call Ratio
        continue-on-error: true
        run: python scripts/fetch_put_call_ratio.py

      - name: commit data/reference/global_macro.parquet
        run: |
          git config user.name  "tw-hold-bot"
          git config user.email "noreply@github.com"
          git add data/reference/global_macro.parquet data/reference/global_macro_meta.json \
                  data/reference/tx_futures.parquet data/reference/tx_futures_meta.json \
                  data/reference/put_call_ratio.parquet
          git diff --cached --quiet -- data/reference/global_macro.parquet data/reference/global_macro_meta.json \
                  data/reference/tx_futures.parquet data/reference/tx_futures_meta.json \
                  data/reference/put_call_ratio.parquet && {
            echo "無實質變更——跳過 commit"; exit 0; }
          git commit -m "國際總經快照 $(date -u +%F)"
          # 跟 rebuild.yml／pcf_retry.yml 都會 commit 回 main，手動重整按鈕一次
          # 觸發兩條時常常撞在一起——push 被拒就 rebase 後重試。
          for i in 1 2 3; do
            git push && break
            echo "push 被拒（可能跟其他排程撞了），pull --rebase 後重試（第 $i 次）"
            git pull --rebase origin main
          done

      # 部分過期（某幾檔比同批其他檔舊超過 3 天，見 fetch_global_macro.py::_check_staleness）
      # 不擋 commit——資料照樣是「這批抓到最新的」，只是有落後的幾檔，先讓 app 有得用。
      - name: 部分過期才告警
        if: always()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(python -c "import json; print(len(json.load(open('data/reference/global_macro_meta.json')).get('stale', [])))" 2>/dev/null || echo 0)
          [ "$N" = "0" ] && { echo "沒有部分過期的 symbol"; exit 0; }
          DETAIL=$(python scripts/_stale_macro_detail.py)
          MSG="🟡 tw-hold 國際總經快照：部分 symbol 資料過期（Yahoo 那批沒補齊）
          $DETAIL
          → 通常下一輪（明天）重抓會自動補上（腳本是整段 2 年全量覆寫）；連續好幾天都
          過期才需要人工介入。
          ${RUN_URL}"
          echo "$MSG"
          [ -z "$WEBHOOK" ] && { echo "::warning::沒設 ALERT_WEBHOOK，這次只留在 Actions 紀錄裡"; exit 0; }
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" || true
          exit 0

      # 台指期夜盤沒有回補機制（date 參數是裝飾用的，帶什麼都回最新一天）——
      # 抓不到當天的夜盤就永久遺失，跟「部分過期」不一樣不會自己好，一定要告警。
      - name: 台指期夜盤缺失才告警
        if: always()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MISSING=$(python -c "import json; print(json.load(open('data/reference/tx_futures_meta.json')).get('missing_night', False))" 2>/dev/null || echo "False")
          [ "$MISSING" != "True" ] && { echo "夜盤資料正常"; exit 0; }
          DETAIL=$(python scripts/_tx_futures_alert_detail.py)
          MSG="🟠 tw-hold 台指期：這次沒抓到夜盤資料，且這支 API 沒有回補機制
          $DETAIL
          → 這天的夜盤收盤可能永久遺失了（不像其他資料源明天重抓會自動補）。
          偶爾一次可能是 TAIFEX 那邊延遲發布，連續好幾天才需要真的介入。
          ${RUN_URL}"
          echo "$MSG"
          [ -z "$WEBHOOK" ] && { echo "::warning::沒設 ALERT_WEBHOOK，這次只留在 Actions 紀錄裡"; exit 0; }
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" || true
          exit 0

  # 2026-09-22 補的缺口：上面三個告警步驟都要 fetch 這步先跑到能寫出 meta.json
  # 才有東西可比對，`fetch_global_macro.py` 直接 crash（那天是 MultiIndex 欄位
  # concat 出 NaN、sorted() 比 float/str 炸掉）時，舊 meta.json 還在、`N` 算出來
  # 可能是 0 → 上面「部分過期才告警」直接判定沒事、整條全靜默，只有 GitHub 自己
  # 的紅叉沒人天天盯。獨立開一個 job 專門對「fetch 這個 job 本身失敗」告警，
  # 不管是哪一步炸的都會响，跟 rebuild.yml::notify-failure 同一個模式。
  notify-failure:
    needs: fetch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 送出失敗通知
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="🔴 tw-hold 國際總經快照整條失敗（跟下面「部分過期」告警不同——這次是
          job 本身炸掉，可能整批資料都沒更新到）
          ${RUN_URL}
          先看是抓資料那步（yfinance）還是 commit 那步紅的。"
          echo "$MSG"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::沒設 ALERT_WEBHOOK Secret，這次失敗只留在 Actions 紀錄裡"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content: $m, text: $m}')" \
            || echo "::warning::告警送不出去，但失敗這件事仍記在 Actions 紀錄裡"
          exit 0
