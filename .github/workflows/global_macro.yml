name: 國際總經快照

# 獨立於 rebuild.yml——那條是台股 bundle 觸發（台北午後），美股都還沒開盤。
# 這條排 UTC 22:00（美東 4pm 收盤最晚 21:00 UTC，留 1 小時緩衝）＝台北隔天 06:00。
# 日經/恆生/KOSPI 台北時間下午就收了，資料早就到齊，跟著美股排程一起拉即可，
# 不用另外排更早的時間。
#
# yfinance 免費、tw-hold 是公開 repo → Actions 分鐘數無限（2026-09-13 查證，
# 不佔 tw-swing 那顆私有 repo 的每月 2000 分鐘額度）。
#
# 見 scripts/fetch_global_macro.py 檔頭：一天一次抓「已完成的常規盤收盤」，絕不即時
# （memory `tw-hold-us-stock-tracking-design`，2026-09-11 定案）。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: global-macro
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 刻意不動 requirements.txt——那份是給 Streamlit Cloud app 用的（PRD 明講
      # 「刻意控依賴」），yfinance 只有這支 CI 腳本要，裝在這裡就好。
      - run: pip install pandas pyarrow yfinance

      - name: 抓國際指數/個股/總經指標
        run: python scripts/fetch_global_macro.py

      # 台指期近月日盤/夜盤——TAIFEX OpenAPI 免key，跟這條排程同一個時間點最合適
      # （夜盤 05:00 收，這條 06:00 跑）。continue-on-error：TAIFEX 偶爾不給資料
      # 不該擋掉上面美股/國際指數那筆真正的每日快照。
      - name: 台指期近月日盤/夜盤
        continue-on-error: true
        run: python scripts/fetch_tx_futures.py

      - name: commit data/reference/global_macro.parquet
        run: |
          git config user.name  "tw-hold-bot"
          git config user.email "noreply@github.com"
          git add data/reference/global_macro.parquet data/reference/global_macro_meta.json data/reference/tx_futures.parquet
          git diff --cached --quiet -- data/reference/global_macro.parquet data/reference/global_macro_meta.json data/reference/tx_futures.parquet && {
            echo "無實質變更——跳過 commit"; exit 0; }
          git commit -m "國際總經快照 $(date -u +%F)"
          git push

      # 部分過期（某幾檔比同批其他檔舊超過 3 天，見 fetch_global_macro.py::_check_staleness）
      # 不擋 commit——資料照樣是「這批抓到最新的」，只是有落後的幾檔，先讓 app 有得用。
      - name: 部分過期才告警
        if: always()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          N=$(python -c "import json; print(len(json.load(open('data/reference/global_macro_meta.json')).get('stale', [])))" 2>/dev/null || echo 0)
          [ "$N" = "0" ] && { echo "沒有部分過期的 symbol"; exit 0; }
          DETAIL=$(python scripts/_stale_macro_detail.py)
          MSG="🟡 tw-hold 國際總經快照：部分 symbol 資料過期（Yahoo 那批沒補齊）
          $DETAIL
          → 通常下一輪（明天）重抓會自動補上（腳本是整段 2 年全量覆寫）；連續好幾天都
          過期才需要人工介入。
          ${RUN_URL}"
          echo "$MSG"
          [ -z "$WEBHOOK" ] && { echo "::warning::沒設 ALERT_WEBHOOK，這次只留在 Actions 紀錄裡"; exit 0; }
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" || true
          exit 0
