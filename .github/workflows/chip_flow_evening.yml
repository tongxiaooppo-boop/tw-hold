name: 籌碼流向（傍晚）

# 外資台指期空單（TAIFEX 期貨三大法人）＋ 上市三大法人買賣超（TWSE BFI82U）都是**盤後**
# 才公布（下午就有）。只靠 global_macro.yml 台北 06:37 那班，頁面要到隔天早上才換成當日數字；
# 這班排在 UTC 10:28＝台北 18:28，讓當天晚上就是當日資料。06:37 那班保留當補漏。
#
# 兩支腳本都是「每次補近 14 天缺的」、重複跑冪等，所以兩班各抓一次沒有問題。
# tw-hold 是公開 repo → Actions 分鐘數無限。
# 跟 global_macro 共用 concurrency group，兩條不會同時 commit 互相撞。

on:
  workflow_dispatch:
  schedule:
    - cron: "28 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: global-macro
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas pyarrow

      # 私有參考資料存私有 repo Release（見 reference/refdata.py），不進公開 repo 的 git；--strict＝還原不完整就中止。
      - name: 還原私有參考資料（ref）
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
          DATA_REPO: ${{ vars.DATA_REPO }}
        run: python scripts/refdata_sync.py pull --only ref --strict

      # 任一支掛掉不該擋另一支（continue-on-error），commit 步驟只在有實質變更時才 commit。
      - name: 外資台指期未平倉
        continue-on-error: true
        run: python scripts/fetch_foreign_futures.py

      - name: 三大法人買賣超
        continue-on-error: true
        run: python scripts/fetch_inst_flow.py

      - name: 推到私有 Release
        env:
          DATA_REPO_PAT: ${{ secrets.DATA_REPO_PAT }}
          DATA_REPO: ${{ vars.DATA_REPO }}
        run: python scripts/refdata_sync.py push data/reference/foreign_futures.parquet data/reference/inst_flow.parquet
