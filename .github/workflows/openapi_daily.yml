name: 官方 OpenAPI 每日收集

# 只存不使用（2026-10-07）：每天抓官方 OpenAPI 的上市日線、上櫃日線、上櫃融資券，加上市融資（網站端點帶日期，08:00～22:00 不請求）、三大法人（網站端點帶日期，18:00 起）與上市／上櫃除權除息預告表快照，存私有 Release `openapi-daily`；不進閘門、不接任何下游。
# 為什麼要每天：OpenAPI 沒有日期參數、只回最新一天，漏一天就補不回來（網站端點才補得回來）。
# 為什麼多班：GitHub 排程實測會延遲 2～9 小時（created_at＝run_started_at，延遲在排程器建立 run 之前）；多班任一班成功即可，
# 重複班次冪等（同一資料日、Last-Modified 沒比較新就略過；較新＝官方事後更正才覆蓋）。
# 班次（UTC，平日）：08:02／10:02／12:02／15:02／20:02 ＝ 台北 16:02／18:02／20:02／23:02／隔日 04:02（不含延遲）。
# 刻意不排整點：GitHub 排程在整點最擁擠、延遲最嚴重（使用者 2026-10-07 指定 16:00 → 16:02）；程式的請求時段只看台北「小時」，:02 不影響。
# 資料日斷言、每次請求的 Last-Modified 記錄、缺交易日偵測見 scripts/selfhost_openapi_daily.py。
# 資料放 DATA_REPO（私有）；沿用 selfhost_collect.yml 的 DATA_REPO／DATA_REPO_PAT 設定。

on:
  workflow_dispatch:
  schedule:
    - cron: "2 8 * * 1-5"
    - cron: "2 10 * * 1-5"
    - cron: "2 12 * * 1-5"
    - cron: "2 15 * * 1-5"
    - cron: "2 20 * * 1-5"

permissions:
  contents: write            # 沒設 DATA_REPO_PAT 時退回內建 token，建立／上傳 Release 需要寫入權限

concurrency:
  group: openapi-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.DATA_REPO_PAT || github.token }}
      GH_REPO: ${{ vars.DATA_REPO || github.repository }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pandas pyarrow requests

      - name: 下載累積檔
        run: |
          mkdir -p data/selfhost
          if gh release view openapi-daily >/dev/null 2>&1; then
            gh release view openapi-daily --json assets --jq '.assets[].name' > data/selfhost/_oa_assets.txt
            # 已有 fetch log（＝不是第一次跑）卻缺 parquet ＝ 上次上傳可能傳到一半（--clobber 是先刪再傳）：不可當成「從來沒有」而從空表重來
            if grep -qx openapi_fetch_log.jsonl data/selfhost/_oa_assets.txt; then
              for f in openapi_prices.parquet openapi_margin.parquet; do
                grep -qx "$f" data/selfhost/_oa_assets.txt || { echo "::error::Release 上有 fetch log 卻缺 $f——疑似上次上傳中斷，請人工處理"; exit 1; }
              done
            fi
            for f in openapi_prices.parquet openapi_margin.parquet openapi_inst.parquet openapi_forecast.jsonl openapi_events.parquet openapi_events_meta.json openapi_fetch_log.jsonl; do
              if grep -qx "$f" data/selfhost/_oa_assets.txt; then
                ok=0
                for try in 1 2 3; do
                  gh release download openapi-daily -D data/selfhost -p "$f" --clobber && ok=1 && break
                  sleep $((try * 10))
                done
                # Release 上有卻下載失敗＝錯：不可當成「尚無舊檔」而用一份只有今天的小檔去覆蓋累積歷史
                [ "$ok" = 1 ] || { echo "::error::下載 $f 失敗（Release 上有）——中止"; exit 1; }
              fi
            done
            # 預告快照：fetch log 已有「成功記錄」卻缺檔＝上次上傳可能傳到一半；預告表只有未來事件、補不回來，不可從空檔重來
            if grep -q '"endpoint": "forecast_[A-Z]*", "rows"' data/selfhost/openapi_fetch_log.jsonl 2>/dev/null && ! grep -qx openapi_forecast.jsonl data/selfhost/_oa_assets.txt; then
              echo "::error::Release 上缺 openapi_forecast.jsonl，但 fetch log 已有預告表成功記錄——疑似上傳中斷，請人工處理"; exit 1
            fi
            # 三大法人累積檔：fetch log 已有成功寫入記錄卻缺檔＝上次上傳可能傳到一半；不可從空表重來（雖然網站端點補得回來，但要人工決定回補範圍）
            if grep -q '"endpoint": "\(twse\|tpex\)_inst", "data_date": "[0-9-]*", "rows"' data/selfhost/openapi_fetch_log.jsonl 2>/dev/null && ! grep -qx openapi_inst.parquet data/selfhost/_oa_assets.txt; then
              # 只停三大法人（網站端點補得回來），不能拖垮補不回來的 OpenAPI 日線／融資／預告表
              echo "::error::Release 上缺 openapi_inst.parquet，但 fetch log 已有三大法人寫入記錄——疑似上傳中斷，三大法人收集已停用，其他照跑，請人工處理"
              echo "INST_DISABLED=1" >> "$GITHUB_ENV"
            fi
          else
            gh release create openapi-daily --title "官方 OpenAPI 每日累積" --notes "由 openapi_daily.yml 維護；只存不使用，勿手動覆蓋"
          fi

      - name: 收集 OpenAPI 日線／融資券
        id: collect
        run: python scripts/selfhost_openapi_daily.py

      - name: 上傳累積檔
        # 收集步驟失敗也要傳（fetch log 記了失敗原因）；但下載累積檔失敗時收集會被跳過，此時不能傳（會用殘缺檔蓋掉歷史）
        # 被取消時不傳（可能有寫到一半的檔）；parquet 只有「真的有新增／更正」才重傳，fetch log 每班都傳（每班都有記錄）
        if: ${{ !cancelled() && steps.collect.conclusion != 'skipped' }}
        run: |
          gh release upload openapi-daily data/selfhost/openapi_fetch_log.jsonl --clobber
          if [ "${{ steps.collect.outputs.changed }}" = "true" ]; then
            for f in openapi_prices.parquet openapi_margin.parquet; do
              [ -f data/selfhost/$f ] && gh release upload openapi-daily data/selfhost/$f --clobber
            done
          fi
          # 三大法人：失敗只警告（網站端點帶日期、補得回來），不擋其他上傳
          if [ "${{ steps.collect.outputs.inst_changed }}" = "true" ] && [ -f data/selfhost/openapi_inst.parquet ]; then
            gh release upload openapi-daily data/selfhost/openapi_inst.parquet --clobber || echo "::warning::三大法人上傳失敗（檔可能已被刪；下一班會偵測並停用法人收集，需人工回補）"
          fi
          # B6 官方事件結果表窗口：失敗只警告（週收集仍會補事件；只是切換後每日還原會晚一點拿到當天事件）
          # ev_ok：事件表有變動卻上傳失敗時，**這班不傳 meta**（Opus 審 H3）——否則 Release 上會是「舊事件表＋新的 through」，
          # daily_merge 會誤判事件已涵蓋到今天。下一班會再抓、再傳（同鍵冪等）。
          ev_ok=1
          if [ "${{ steps.collect.outputs.events_changed }}" = "true" ] && [ -f data/selfhost/openapi_events.parquet ]; then
            gh release upload openapi-daily data/selfhost/openapi_events.parquet --clobber || { ev_ok=0; echo "::warning::事件表上傳失敗，這班不傳 meta，下一班會再傳"; }
          fi
          if [ "${{ steps.collect.outputs.events_meta_changed }}" = "true" ] && [ "$ev_ok" = 1 ] && [ -f data/selfhost/openapi_events_meta.json ]; then
            gh release upload openapi-daily data/selfhost/openapi_events_meta.json --clobber || echo "::warning::事件 meta 上傳失敗，下一班會再傳"
          fi
          # 預告快照放最後、失敗只警告：不能因為它擋掉當班日線／融資的上傳（OpenAPI 只回最新一天，漏傳就補不回來）
          if [ "${{ steps.collect.outputs.forecast_changed }}" = "true" ] && [ -f data/selfhost/openapi_forecast.jsonl ]; then
            gh release upload openapi-daily data/selfhost/openapi_forecast.jsonl --clobber || echo "::warning::預告快照上傳失敗，下一班會再傳"
          fi
