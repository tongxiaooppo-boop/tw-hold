name: 每日重算三清單

# tw-swing publish（U1a/U1b）完成後，用 repository_dispatch 觸發這支：
# 拉 bundle → 算因子 → 產三清單 JSON → commit 回 data/derived/。
#
# M0b：已接線——fetch_bundle → build_lists → commit data/derived/。
#
# ## 自動觸發（M3——目前刻意手動，PLAN §M3「先手動跑幾天再開排程」）
#
# 兩條路，擇一，等使用者觀察幾天後決定：
#  (a) 【建議】tw-swing `publish_bundle.yml` 末尾加 curl 發 repository_dispatch
#      `bundle-published` → 本檔。需 tw-hold 給一顆 PAT、設成 tw-swing 的
#      secret `TWHOLD_DISPATCH_PAT`（contents:write 或 actions:write）。
#      好處：只有真的有新 bundle 才重算，不會空跑。
#  (b) 直接在下面 `on:` 加 cron（平日 UTC 07:30，publish_bundle 06:00 之後）：
#        schedule:
#          - cron: "30 7 * * 1-5"
#      壞處：bundle 沒更新的日子也會冷啟 + 產生只有 rebuilt_at 變的 commit。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bundle-published]

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 拉上游 bundle
        env:
          TWSWING_BUNDLE_PAT: ${{ secrets.TWSWING_BUNDLE_PAT }}
        run: python fetch_bundle.py

      - name: 算因子 + 三清單
        run: python build_lists.py   # screen_all() → data/derived/{value,deposit,swing}_list.json + _meta.json

      - name: commit data/derived/
        run: |
          git config user.name  "tw-hold-bot"
          git config user.email "noreply@github.com"
          git add data/derived/ || true
          git diff --cached --quiet && { echo "無變更"; exit 0; }
          git commit -m "rebuild: 三清單 $(date -u +%F) (${{ github.event_name }})"
          git push

  # ⚠️ 這個 job 自己絕對不可以失敗（抄自 tw-swing daily.yml）。
  notify-failure:
    needs: rebuild
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 送出失敗通知
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="🔴 tw-hold 每日重算失敗（觸發：${{ github.event_name }}）
          ${RUN_URL}
          清單沒更新不影響真錢（tw-hold 是決策支援不上真錢），但 app 會顯示舊日期。
          先看是哪一步紅的：拉 bundle 失敗（上游 Release / PAT）還是算因子失敗。"
          echo "$MSG"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::沒設 ALERT_WEBHOOK Secret，這次失敗只留在 Actions 紀錄裡"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content: $m, text: $m}')" \
            || echo "::warning::告警送不出去，但失敗這件事仍記在 Actions 紀錄裡"
          exit 0
