name: 每日重算三清單

# tw-swing publish（U1a/U1b）完成後，用 repository_dispatch 觸發這支：
# 拉 bundle → 算因子 → 產三清單 JSON → commit 回 data/derived/。
#
# M0b：已接線——fetch_bundle → build_lists → commit data/derived/。
#
# ## 自動觸發＋備援（2026-09-22 補）
#
# 主路徑是 (a) tw-swing `publish_bundle.yml` 末尾發 repository_dispatch
# `bundle-published` → 本檔，只有真的有新 bundle 才重算，不會空跑。
#
# 但這條路是單點依賴：dispatch 沒送到（tw-swing 那邊失敗、PAT 過期、網路問題）
# 的話，rebuild **不會失敗、只是不再跑**，heartbeat.yml 會抓到「資料還是舊的」
# 但只會告警——沒設 ALERT_WEBHOOK 的話等於沒人知道（2026-09-22 查證：這個
# repo 從沒設過這個 secret）。跟其等人看告警去手動重跑，加 (b) 排程備援自己
# 主動重試：平日 UTC 08:00（台北 16:00，早過 tw-swing 平常落地時間、也過了
# 開盤，純粹補漏用）。bundle 沒變的日子這裡會是空 commit 被 diff --cached
# --quiet 那段自動跳過，不會洗出一堆沒意義的 commit。

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bundle-published]
  schedule:
    - cron: "0 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 拉上游 bundle
        env:
          TWSWING_BUNDLE_PAT: ${{ secrets.TWSWING_BUNDLE_PAT }}
        run: python fetch_bundle.py

      # 006201（元大富櫃50，唯一追蹤櫃買指數的 ETF）不在 tw-swing data_pack 的
      # universe 裡，獨立向 FinMind 抓（總經導航 MA60/MA200 卡用）。跟三清單
      # 無關，失敗不擋主線——見 scripts/fetch_index_proxy.py 檔頭。
      # 2026-09-16 起跟 0050 共用同一套驗證（reference/price_series_guard.py）：
      # 抓到的資料沒過驗證就保留舊檔不覆寫、exit 1，被下面的告警步驟撿到。
      - name: 櫃買代理 006201 快照（驗證後才覆寫）
        id: fetch_006201
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/fetch_index_proxy.py

      # 0050 卡片改讀這份 tw-swing 早就有附的小檔（見 index_0050.parquet），
      # 不用再讓總經導航拖一整包 prices_adj.parquet 才能顯示（2026-09-16）。
      # 驗證沒過（資料倒退/疑似損毀）就保留舊檔案不覆寫，見 scripts/promote_index_0050.py
      # 檔頭——「前一日資料錯誤不可原諒」，寧可暫時舊也不要覆蓋成錯的。
      - name: 上市代理 0050 快照（驗證後才覆寫）
        id: promote_0050
        continue-on-error: true
        run: python scripts/promote_index_0050.py

      # 偵測到 bundle 有未還原的分割/減資跳空 → 抓 FinMind 事件表自動算 factor、
      # 寫進 corporate_actions_resolved.json。要在 build_lists 之前跑，當次就修好。
      - name: 自動解析未還原分割
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/resolve_splits.py --write

      - name: 算因子 + 三清單
        run: python build_lists.py   # screen_all() → data/derived/{value,deposit,swing}_list.json + _meta.json

      # 主動式 ETF 認養旗標（context flag，非 gate）。抓規模前五大主動 ETF 的官網
      # 每日 PCF → 落 data/pcf/ 快照 → 前後兩日差分 → active_etf_flags.json。
      # 單一投信掛掉 / 網路失敗都 continue-on-error，**不擋三清單**。
      - name: 主動式 ETF PCF 快照
        continue-on-error: true
        run: python scripts/snapshot_pcf.py       # → data/pcf/<code>/<date>.parquet

      - name: 主動式 ETF 認養旗標
        continue-on-error: true
        run: python build_active_etf_flags.py     # → data/derived/active_etf_flags.json

      # factors_*.parquet 刻意不進版控（每天一顆 blob）→ 推到 derived-latest release，
      # 讓 Streamlit Cloud 的「三軌體檢」頁執行期拉得到（tw-hold 是公開 repo，免 PAT）。
      - name: 因子表 → derived-latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view derived-latest >/dev/null 2>&1 \
            || gh release create derived-latest --title "derived factors (latest)" \
                 --notes "build_lists.py 產出的逐檔因子表；rebuild.yml 每次覆蓋。app 三軌體檢頁執行期讀。"
          gh release upload derived-latest --clobber \
            data/derived/factors_value.parquet data/derived/factors_deposit.parquet

      - name: 自動解不了的分割才告警
        if: always()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          W=$(python -c "import json,sys; print(json.load(open('data/derived/_meta.json')).get('split_warning',''))" 2>/dev/null || true)
          [ -z "$W" ] && { echo "分割全部自動解掉了 / 無跳空"; exit 0; }
          echo "::warning::有跳空 resolve_splits 解不了（FinMind 無對應事件）：$W"
          MSG="🟠 tw-hold 偵測到跳空、但 FinMind 查無對應分割/減資事件
          $W
          → 可能是 FinMind 還沒發佈（等一天），或真的是資料雜訊。
          手動裁決：加進 reference/corporate_actions.py 的 _MANUAL 或 IGNORE_JUMPS。
          ${RUN_URL}"
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" || true
          exit 0

      # 兩支市場代理共用一個告警步驟：任一沒更新都要有人知道，否則「保留舊檔」
      # 會變成沒人發現的慢性問題（卡片悄悄一直顯示舊資料）。
      - name: 市場代理快照沒更新才告警
        if: steps.promote_0050.outcome == 'failure' || steps.fetch_006201.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          F50: ${{ steps.promote_0050.outcome }}
          F62: ${{ steps.fetch_006201.outcome }}
        run: |
          WHICH=""
          [ "$F50" = "failure" ] && WHICH="${WHICH}・上市 0050（scripts/promote_index_0050.py）
          "
          [ "$F62" = "failure" ] && WHICH="${WHICH}・上櫃 006201（scripts/fetch_index_proxy.py）
          "
          echo "::warning::市場代理快照沒更新：${WHICH}"
          MSG="🟠 tw-hold：總經導航的市場代理快照沒更新
          ${WHICH}
          原因看上面那一步的 log：[REJECT] 開頭是驗證擋下來的（資料縮水／日期倒退／
          歷史被改寫／單日跳空），其他則是抓取本身失敗（FinMind API、token、網路）。
          任一種情況都**保留舊檔案沒有覆寫**——卡片會顯示舊資料，不會顯示錯的資料。
          連續幾天都收到這則 → 上游格式可能悄悄變了，要去看驗證條件是不是該調。
          ${RUN_URL}"
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -X POST "$WEBHOOK" -H "Content-Type: application/json" --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" || true

      - name: commit data/derived/ + resolved.json
        run: |
          git config user.name  "tw-hold-bot"
          git config user.email "noreply@github.com"
          git add data/derived/ data/pcf/ data/reference/ reference/corporate_actions_resolved.json || true
          # 三張清單 JSON 沒實質變動、resolved.json 沒新增分割、且 PCF 快照/006201 代理無新增 →
          # 整批跳過（不為「只有 _meta.json 的 rebuilt_at / flags 的 fetched_at 變了」留 commit）。
          if git diff --cached --quiet -- \
               data/derived/value_list.json \
               data/derived/deposit_list.json \
               data/derived/swing_list.json \
               data/pcf/ \
               data/reference/ \
               reference/corporate_actions_resolved.json; then
            echo "三清單 + resolved.json + PCF 快照 皆無實質變更——跳過 commit"; exit 0
          fi
          git commit -m "rebuild: 三清單 $(date -u +%F) (${{ github.event_name }})"
          git push

  # ⚠️ 這個 job 自己絕對不可以失敗（抄自 tw-swing daily.yml）。
  notify-failure:
    needs: rebuild
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 送出失敗通知
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="🔴 tw-hold 每日重算失敗（觸發：${{ github.event_name }}）
          ${RUN_URL}
          清單沒更新不影響真錢（tw-hold 是決策支援不上真錢），但 app 會顯示舊日期。
          先看是哪一步紅的：拉 bundle 失敗（上游 Release / PAT）還是算因子失敗。"
          echo "$MSG"
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::沒設 ALERT_WEBHOOK Secret，這次失敗只留在 Actions 紀錄裡"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --max-time 20 \
            -d "$(jq -n --arg m "$MSG" '{content: $m, text: $m}')" \
            || echo "::warning::告警送不出去，但失敗這件事仍記在 Actions 紀錄裡"
          exit 0
