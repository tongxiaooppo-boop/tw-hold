name: 檢查 TWSWING_DISPATCH_PAT（手動）

# 只能手動觸發、只做讀取檢查，**不會真的觸發 tw-swing**。不印出 token 內容。
# B10：tw-hold 自建資料包產完後要觸發 tw-swing 的 daily.yml，用這顆 fine-grained PAT（只給 tw-swing 的 Actions 讀寫）。
# 檢查：①secret 有設且結尾乾淨 ②讀得到 tw-swing 的 daily.yml ③到期日（回應標頭）④碰不到另一個私有 repo tw-hold-data（權限範圍沒放太寬）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOK: ${{ secrets.TWSWING_DISPATCH_PAT }}
    steps:
      - name: secret 有設且結尾乾淨
        run: |
          [ -n "$TOK" ] || { echo "::error::TWSWING_DISPATCH_PAT 沒設或是空的"; exit 1; }
          echo "長度：${#TOK}"
          last=$(printf '%s' "$TOK" | tail -c1 | od -An -tx1 | tr -d ' ')
          case "$last" in 0a|0d|20|09) echo "::error::結尾有換行／空白，請重設 secret"; exit 1;; esac
          echo "結尾乾淨"
      - name: 讀得到 tw-swing 的 daily.yml，並印到期日
        run: |
          code=$(curl -s -D /tmp/h.txt -o /tmp/r.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tongxiaooppo-boop/tw-swing/actions/workflows/daily.yml)
          echo "HTTP $code"
          grep -i '^github-authentication-token-expiration' /tmp/h.txt || echo "（回應沒有到期日標頭）"
          python3 -c "import json;j=json.load(open('/tmp/r.json'));print('workflow:',j.get('name'),'| state:',j.get('state'),'| path:',j.get('path'))"
          [ "$code" = 200 ] || { echo "::error::讀不到 tw-swing 的 daily.yml（權限或名稱不對）"; exit 1; }
      - name: 能看到最近的 run（Actions 讀權限）
        run: |
          code=$(curl -s -o /tmp/runs.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/tongxiaooppo-boop/tw-swing/actions/workflows/daily.yml/runs?per_page=1")
          echo "HTTP $code"
          python3 -c "import json;j=json.load(open('/tmp/runs.json'));print('total_count',j.get('total_count'))"
          [ "$code" = 200 ] || exit 1
      - name: 碰不到另一個私有 repo（tw-hold-data）
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tongxiaooppo-boop/tw-hold-data)
          echo "HTTP $code（預期 404 或 403）"
          if [ "$code" = 200 ]; then echo "::error::這顆 token 讀得到 tw-hold-data——權限範圍太寬，請重建只選 tw-swing"; exit 1; fi
          echo "OK：權限範圍只限 tw-swing"
