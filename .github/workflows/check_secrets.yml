name: 檢查 secrets（手動）

# 只能手動觸發。不印出任何 secret 內容：只印長度、結尾字元是否為換行／空白、以及用「未處理過的原值」打 FinMind 的結果。
# 用途：secret 貼上時常帶結尾換行（2026-10-06 實際發生，FinMind 回 400 Token is illegal）；程式端雖然會 strip，仍可用這個確認存的值乾淨。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - name: FINMIND_TOKEN 長度與結尾字元
        run: |
          [ -n "$FINMIND_TOKEN" ] || { echo "::error::FINMIND_TOKEN 沒設"; exit 1; }
          echo "長度：${#FINMIND_TOKEN}"
          last=$(printf '%s' "$FINMIND_TOKEN" | tail -c1 | od -An -tx1 | tr -d ' ')
          echo "最後一個字元（十六進位）：$last"
          case "$last" in 0a|0d|20|09) echo "::error::結尾有換行／空白，請重設 secret"; exit 1;; esac
          echo "結尾乾淨"
      - name: 用原值打 FinMind（不經任何 strip）
        run: |
          code=$(curl -s -o /tmp/r.json -w "%{http_code}" -G "https://api.finmindtrade.com/api/v4/data" \
            --data-urlencode "dataset=TaiwanStockPrice" --data-urlencode "data_id=2330" \
            --data-urlencode "start_date=2026-10-01" --data-urlencode "end_date=2026-10-05" \
            --data-urlencode "token=$FINMIND_TOKEN")
          echo "HTTP $code"; python3 -c "import json;j=json.load(open('/tmp/r.json'));print('status',j.get('status'),'msg',j.get('msg'),'rows',len(j.get('data') or []))"
          [ "$code" = 200 ] || exit 1
