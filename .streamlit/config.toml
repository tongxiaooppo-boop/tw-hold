# tw-hold — 「玫瑰莓」淺／深雙主題（2026-11-21；前版北歐靜謐 2026-11-16）。
# 使用者在右上「⋮ → Settings」切換。色票的唯一色源仍是 app/streamlit_app.py `_CSS` 的
# :root（淺）與 :root[data-thc="dark"]（深）；這裡只定 Streamlit 原生元件的地基色。
[theme]
font = "sans serif"

[theme.light]
base = "light"
primaryColor = "#B4405E"
backgroundColor = "#F7F1EC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2E2926"

[theme.dark]
base = "dark"
primaryColor = "#E77A98"
backgroundColor = "#141215"
secondaryBackgroundColor = "#1F1B20"
textColor = "#EEE8EC"
