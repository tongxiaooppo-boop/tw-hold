# tw-hold — 固定淺色主題「北歐靜謐」（使用者裁決 2026-09-11，取代 2026-09-08 的深色版）。
# 這裡定的是「地基色」；字體、卡片、圖表細節在 app/streamlit_app.py 的 _inject_css()
# 與 app/stockcharts.py 裡對齊同一組色票（見那邊的 --thc-* 變數）。
[theme]
base = "light"
primaryColor = "#5C7A72"                 # 靜謐綠 accent
backgroundColor = "#EEF1F4"              # 主畫布
secondaryBackgroundColor = "#FFFFFF"     # 卡片 / 側欄 / 程式碼區 / 表格底
textColor = "#2B333B"
font = "sans serif"
