# tw-hold — 淺色 A「北歐靜謐・加深版」／深色 C「深色看盤」雙主題（2026-11-16）。
# 使用者在右上「⋮ → Settings」切換。色票的唯一色源仍是 app/streamlit_app.py `_CSS` 的
# :root（淺）與 :root[data-thc="dark"]（深）；這裡只定 Streamlit 原生元件的地基色。
[theme]
font = "sans serif"

[theme.light]
base = "light"
primaryColor = "#4F6E66"
backgroundColor = "#EEF1F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2B333B"

[theme.dark]
base = "dark"
primaryColor = "#4FA3A5"
backgroundColor = "#11161C"
secondaryBackgroundColor = "#1A2129"
textColor = "#E8ECF1"
